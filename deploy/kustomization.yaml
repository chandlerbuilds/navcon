# Argo CD deploys this folder to the team namespace on the lunzerr cluster.
# The GitHub Action sets the image below on every push to main; don't edit
# newName or newTag by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-lunzerr
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
images:
  - name: app
    newName: ghcr.io/chandlerbuilds/navcon
    newTag: "3347cb9"
