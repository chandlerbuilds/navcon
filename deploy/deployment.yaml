apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: app
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ELASTICSEARCH_INDEX
              value: navcon-places
            # Optional: without the Secret, /api/search answers {configured:false}
            # and the app searches on the device.
            #   kubectl -n team-lunzerr create secret generic app-credentials \
            #     --from-literal=elasticsearch-url=... --from-literal=elasticsearch-api-key=...
            - name: ELASTICSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: elasticsearch-url
                  optional: true
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-credentials
                  key: elasticsearch-api-key
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
